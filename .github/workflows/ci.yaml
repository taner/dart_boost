name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  test:
    name: Test (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here: path separators, `where.exe` detection,
        # CRLF in spliced configs and terminal raw mode all differ.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `3.7.0` is the declared floor; `stable` is what users are actually on.
        sdk: [stable, "3.7.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart test --reporter=expanded

  assets:
    # The asset guard runs on every change, not just at release time: it is
    # worthless if it only catches the problem after fragments already exist.
    name: Publishable assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Every file under guidelines/ must survive packaging
        run: dart run tool/verify_assets.dart
