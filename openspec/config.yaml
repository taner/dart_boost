schema: spec-driven

context: |
  dart_boost is a Dart CLI on pub.dev. It installs version-aware AI coding
  guidelines and MCP configuration into nine coding agents, and records a
  project's own decisions as glob-scoped rules under `.ai/rules/`.

  It ships no runtime server beyond one purpose-built MCP tool (`record_rule`);
  it deliberately does not reimplement the SDK's `dart mcp-server`.

  Conventions that matter here:
  - Dart SDK floor is `^3.7.0`. Do not raise it.
  - Nothing throws: malformed input degrades with a warning, never aborts.
  - Every user-file write goes through AtomicWriter (temp file + rename).
  - Bundled assets are never dot-prefixed: `dart pub publish` strips
    dot-prefixed paths, so a `.ai/` tree inside this package would vanish from
    the release. `tool/verify_assets.dart` guards this.
  - `dart format` and `dart analyze --fatal-infos` must be clean.
  - Doc comments explain WHY a decision was made, not what the code does.
  - Tests are hermetic: no network, no subprocesses outside FakeProcessRunner.

  How changes are built here: OpenSpec owns the spec and the living capability
  set; the superpowers skills own execution. Every change gets an OpenSpec
  change folder; only architectural work also gets a superpowers plan.
  `superpowers:brainstorming` shapes the change and classifies it -- bounded
  means author the change folder and implement with TDD, architectural means
  also run `superpowers:writing-plans` into this change's folder and build with
  `superpowers:subagent-driven-development`. Never write to
  `docs/`. After the branch merges, archive the change so the specs
  become true again.

